<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurants With No Website</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <h1>Restaurants with no website</h1>
        <p class="subtitle">
          Enter any city, neighborhood, or country in the world to open a lead-search pack across Google, Google Maps, and Apple Maps for restaurants that may not have a website. This is a starting point, not a perfect filter.
        </p>

        <form id="lead-form">
          <input id="industry" type="hidden" value="restaurants" />
          <input id="location" type="text" placeholder="e.g. Paris, London, Dubai" required />
          <button type="submit">Find restaurants</button>
        </form>

        <div id="summary" class="summary"></div>

        <div id="results" class="results"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
