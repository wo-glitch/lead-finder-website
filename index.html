<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant Lead Search Pack</title>
    <link rel="stylesheet" href="styles.css?v=20260704-2" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <h1>Restaurants with no website</h1>
        <p class="subtitle">
          Search for businesses, filter to those with no website, and review the leads in a list. This uses live business data when a Google Places API key is provided.
        </p>

        <form id="lead-form">
          <input id="query" type="text" placeholder="e.g. Restaurants in Kuwait or Gyms near me" required />
          <input id="location" type="text" placeholder="e.g. Kuwait City" />
          <input id="radius" type="number" min="1" value="10000" placeholder="radius in meters" />
          <input id="api-key" type="text" placeholder="Google Places API key" />
          <label class="checkbox-row">
            <input id="no-website-only" type="checkbox" checked />
            <span>No website only</span>
          </label>
          <button type="submit">Find leads</button>
        </form>

        <div id="summary" class="summary"></div>
        <div id="results" class="results"></div>
      </section>
    </main>

    <script src="search-utils.js?v=20260704-3"></script>
    <script src="script.js?v=20260704-3"></script>
  </body>
</html>
